<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 오토팜 모니터</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0d0f;
    --bg2:       #111518;
    --bg3:       #181d21;
    --border:    #1f2a2f;
    --green:     #3ddc84;
    --green-dim: #1a4d33;
    --yellow:    #f5c842;
    --red:       #ff4f4f;
    --blue:      #4fc3f7;
    --text:      #cdd6da;
    --text-dim:  #5a6a72;
    --text-mid:  #8fa3ad;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  /* ── 헤더 ── */
  header {
    max-width: 720px;
    margin: 0 auto 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
  }
  header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.04em;
  }
  header h1 span { color: var(--text-dim); font-weight: 400; }
  #updated {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  /* ── 레이아웃 ── */
  .wrap { max-width: 720px; margin: 0 auto; }

  /* ── 탑 카드 그리드 ── */
  .top-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }
  @media (max-width: 520px) {
    .top-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card .c-label {
    font-size: 0.68rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'JetBrains Mono', monospace;
  }
  .card .c-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.35rem;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }
  .card .c-sub {
    font-size: 0.72rem;
    color: var(--text-mid);
    margin-top: 2px;
  }

  /* 색상 */
  .c-green  { color: var(--green)  !important; }
  .c-yellow { color: var(--yellow) !important; }
  .c-red    { color: var(--red)    !important; }
  .c-blue   { color: var(--blue)   !important; }
  .c-dim    { color: var(--text-dim) !important; }

  /* ── 상태 바 ── */
  .status-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .s-row {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .s-row .s-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text-mid);
  }
  .s-row .s-icon { font-size: 1rem; }
  .s-row .s-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 600;
  }

  /* ON/OFF 뱃지 */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
  }
  .badge-on  { background: var(--green-dim); color: var(--green); }
  .badge-off { background: #1a1f23; color: var(--text-dim); }
  .badge-warn { background: #3a2e00; color: var(--yellow); }
  .badge::before { content: '●'; font-size: 0.6rem; }

  /* ── 배터리 바 ── */
  .bat-bar-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .bat-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px;
  }
  .bat-bar-track {
    height: 8px;
    background: var(--bg3);
    border-radius: 4px;
    overflow: hidden;
  }
  .bat-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease, background 0.4s;
    width: 0%;
  }

  /* ── 차트 ── */
  .chart-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .chart-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  canvas { width: 100% !important; }

  /* ── 히스토리 테이블 ── */
  .hist-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    overflow-x: auto;
  }
  .hist-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
  }
  th {
    color: var(--text-dim);
    font-weight: 400;
    text-align: left;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    color: var(--text-mid);
    padding: 5px 8px;
    border-bottom: 1px solid #151a1d;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #13191d; }

  /* ── 로딩 ── */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }
  .dot-anim::after {
    content: '';
    animation: dots 1.5s infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    33%  { content: '.'; }
    66%  { content: '..'; }
    100% { content: '...'; }
  }

  /* ── 에러 배너 ── */
  .err-banner {
    background: #2a0f0f;
    border: 1px solid #5a1a1a;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.78rem;
    color: var(--red);
    margin-bottom: 12px;
    display: none;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>🌱 AUTOFARM <span>MONITOR</span></h1>
    <div id="updated">연결 중...</div>
  </header>

  <div class="err-banner" id="err-banner">⚠ 서버 연결 실패 — 마지막 데이터를 표시 중입니다</div>

  <!-- 탑 카드 -->
  <div class="top-grid">
    <div class="card">
      <div class="c-label">Battery</div>
      <div class="c-val" id="bat-v">--</div>
      <div class="c-sub" id="bat-pct">-- %</div>
    </div>
    <div class="card">
      <div class="c-label">Solar</div>
      <div class="c-val" id="sol-v">--</div>
      <div class="c-sub" id="sol-eff">효율 -- %</div>
    </div>
    <div class="card">
      <div class="c-label">Weather</div>
      <div class="c-val" id="weather" style="font-size:1.1rem">--</div>
      <div class="c-sub" id="sun-time">-- / --</div>
    </div>
    <div class="card">
      <div class="c-label">Uptime</div>
      <div class="c-val" id="ontime" style="font-size:0.95rem; padding-top:4px">--</div>
    </div>
  </div>

  <!-- 배터리 바 -->
  <div class="bat-bar-wrap">
    <div class="bat-bar-label">
      <span>BATTERY LEVEL</span>
      <span id="bat-pct-bar">-- %</span>
    </div>
    <div class="bat-bar-track">
      <div class="bat-bar-fill" id="bat-fill"></div>
    </div>
  </div>

  <!-- 상태 리스트 -->
  <div class="status-list">
    <div class="s-row">
      <div class="s-left"><span class="s-icon">💧</span> 워터펌프</div>
      <div class="s-val" id="pump-status">--</div>
    </div>
    <div class="s-row">
      <div class="s-left"><span class="s-icon">⛏️</span> 코인채굴</div>
      <div class="s-val" id="sub-status">--</div>
    </div>
    <div class="s-row">
      <div class="s-left"><span class="s-icon">☀️</span> 태양광 상태</div>
      <div class="s-val" id="sol-status">--</div>
    </div>
  </div>

  <!-- 차트 - 배터리 -->
  <div class="chart-block">
    <div class="chart-title">📈 Battery Voltage — 최근 24h</div>
    <canvas id="batChart" height="100"></canvas>
  </div>

  <!-- 차트 - 태양광 -->
  <div class="chart-block">
    <div class="chart-title">☀️ Solar Efficiency — 최근 24h</div>
    <canvas id="solChart" height="100"></canvas>
  </div>

  <!-- 히스토리 테이블 -->
  <div class="hist-block">
    <div class="hist-title">📋 History</div>
    <table>
      <thead>
        <tr>
          <th>시각</th>
          <th>배터리</th>
          <th>태양광</th>
          <th>날씨</th>
          <th>펌프</th>
          <th>채굴</th>
        </tr>
      </thead>
      <tbody id="hist-body">
        <tr><td colspan="6" class="loading dot-anim">LOADING</td></tr>
      </tbody>
    </table>
  </div>

</div><!-- /wrap -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const API_BASE    = "https://kgu3405.tplinkdns.com";
const API_LATEST  = API_BASE + "/api/autofarm/latest";
const API_HISTORY = API_BASE + "/api/autofarm/history?limit=48";

// ── 차트 초기화 ──
const chartOpts = (yMin, yMax, color) => ({
  responsive: true,
  animation: { duration: 400 },
  plugins: { legend: { display: false }, tooltip: {
    backgroundColor: '#1a2228',
    borderColor: '#2a3540',
    borderWidth: 1,
    titleColor: '#8fa3ad',
    bodyColor: '#cdd6da',
    titleFont: { family: 'JetBrains Mono' },
    bodyFont:  { family: 'JetBrains Mono' },
  }},
  scales: {
    x: {
      ticks: { color: '#3a4f58', maxTicksLimit: 8, font: { family: 'JetBrains Mono', size: 10 } },
      grid:  { color: '#13191d' }
    },
    y: {
      min: yMin, max: yMax,
      ticks: { color: '#5a7080', font: { family: 'JetBrains Mono', size: 10 } },
      grid:  { color: '#13191d' }
    }
  }
});

const mkDataset = (color) => ({
  data: [],
  borderColor: color,
  backgroundColor: color + '18',
  tension: 0.35,
  fill: true,
  pointRadius: 2,
  pointHoverRadius: 4,
  borderWidth: 1.8
});

const batChart = new Chart(document.getElementById("batChart"), {
  type: "line",
  data: { labels: [], datasets: [mkDataset("var(--green, #3ddc84)")] },
  options: chartOpts(3.3, 4.3, "#3ddc84")
});
const solChart = new Chart(document.getElementById("solChart"), {
  type: "line",
  data: { labels: [], datasets: [mkDataset("var(--yellow, #f5c842)")] },
  options: chartOpts(0, 100, "#f5c842")
});

// ── 유틸 ──
function pctColor(pct) {
  if (pct >= 60) return "c-green";
  if (pct >= 40) return "c-yellow";
  return "c-red";
}

function barColor(pct) {
  if (pct >= 60) return "#3ddc84";
  if (pct >= 40) return "#f5c842";
  return "#ff4f4f";
}

function badge(text, type) {
  return `<span class="badge badge-${type}">${text}</span>`;
}

function pumpBadge(status) {
  if (!status) return badge('--', 'off');
  if (status.includes('완료')) return badge('완료 ✅', 'on');
  if (status.includes('대기')) return badge('대기중', 'warn');
  return badge('OFF', 'off');
}

function subBadge(status, active) {
  if (active) return badge('ON', 'on');
  if (status && status.includes('배터리')) return badge('배터리부족', 'warn');
  if (status && status.includes('날씨'))   return badge('날씨불량', 'warn');
  return badge('OFF', 'off');
}

function solBadge(status) {
  if (!status || status === '정상') return badge('충전중', 'on');
  if (status.includes('역류'))      return badge('역류', 'warn');
  return badge('충전OFF', 'off');
}

function timeLabel(ts) {
  if (!ts) return '--';
  // "26.06.04 11:00" → "11:00"
  return ts.slice(-5);
}

// ── 최신 데이터 렌더 ──
function renderLatest(d) {
  // 배터리
  const pct = d.battery_percent || 0;
  const vEl = document.getElementById("bat-v");
  vEl.textContent = (d.battery_v || '--') + 'V';
  vEl.className   = "c-val " + pctColor(pct);
  document.getElementById("bat-pct").textContent = pct + '% · ' + (d.battery_status || '');
  document.getElementById("bat-pct-bar").textContent = pct + '%';
  const fill = document.getElementById("bat-fill");
  fill.style.width      = pct + '%';
  fill.style.background = barColor(pct);

  // 태양광
  document.getElementById("sol-v").textContent   = (d.solar_v || 0) + 'V';
  document.getElementById("sol-eff").textContent = '효율 ' + (d.solar_efficiency || 0) + '%';

  // 날씨
  const wMap = { '맑음':'☀️', '구름많음':'⛅', '흐림':'☁️', '비':'🌧️', '비/눈':'🌨️', '눈':'❄️', '소나기':'🌦️' };
  document.getElementById("weather").textContent  = (wMap[d.weather] || '') + ' ' + (d.weather || '--');
  document.getElementById("sun-time").textContent = '🌅' + (d.sunrise || '--') + '  🌇' + (d.sunset || '--');

  // 온타임
  document.getElementById("ontime").textContent = d.ontime || '--';

  // 상태 배지
  document.getElementById("pump-status").innerHTML = pumpBadge(d.pump_status);
  document.getElementById("sub-status").innerHTML  = subBadge(d.sub_esp_status, d.sub_esp_active);
  document.getElementById("sol-status").innerHTML  = solBadge(d.solar_status);

  // 업데이트 시각
  document.getElementById("updated").textContent = '업데이트 ' + (d.timestamp || '--');
}

// ── 히스토리 렌더 ──
function renderHistory(rows) {
  // 차트용 (오래된 순)
  const rev = [...rows].reverse();
  batChart.data.labels           = rev.map(r => timeLabel(r.timestamp));
  batChart.data.datasets[0].data = rev.map(r => r.battery_v);
  batChart.update();

  solChart.data.labels           = rev.map(r => timeLabel(r.timestamp));
  solChart.data.datasets[0].data = rev.map(r => r.solar_efficiency);
  solChart.update();

  // 테이블 (최신 순, 최대 20행)
  const tbody = document.getElementById("hist-body");
  const slice = rows.slice(0, 20);
  if (!slice.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:#3a4f58;text-align:center;padding:16px">데이터 없음</td></tr>';
    return;
  }
  tbody.innerHTML = slice.map(r => {
    const pct  = r.battery_percent || 0;
    const col  = pct >= 60 ? '#3ddc84' : pct >= 40 ? '#f5c842' : '#ff4f4f';
    const pump = r.pump_status || '--';
    const sub  = r.sub_esp_active ? '<span style="color:#3ddc84">ON</span>' : '<span style="color:#3a4f58">OFF</span>';
    return `<tr>
      <td>${timeLabel(r.timestamp)}</td>
      <td style="color:${col}">${r.battery_v}V <span style="color:#3a4f58">${pct}%</span></td>
      <td>${r.solar_v}V <span style="color:#3a4f58">${r.solar_efficiency}%</span></td>
      <td>${r.weather || '--'}</td>
      <td>${pump.includes('완료') ? '✅' : pump.includes('대기') ? '⏳' : '⚫'}</td>
      <td>${sub}</td>
    </tr>`;
  }).join('');
}

// ── fetch ──
async function loadLatest() {
  try {
    const res = await fetch(API_LATEST);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    renderLatest(d);
    document.getElementById("err-banner").style.display = 'none';
  } catch(e) {
    console.error("latest 실패:", e);
    document.getElementById("err-banner").style.display = 'block';
  }
}

async function loadHistory() {
  try {
    const res = await fetch(API_HISTORY);
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    renderHistory(rows);
  } catch(e) {
    console.error("history 실패:", e);
  }
}

async function refresh() {
  await loadLatest();
  await loadHistory();
}

refresh();
setInterval(refresh, 60 * 1000);
</script>
</body>
</html>
